# ── Paths ─────────────────────────────────────────────────────────────────────
# Update these to match your local setup. All paths are relative to the repo
# root unless they start with /. Use forward slashes on all platforms.
paths:
  # Where processed .pkl and .npz files are written
  processed_dir: data/processed/

  # Where train/test/val splits are written
  splits_dir: data/processed/splits/

  # Where trained model weights (.pth) and the Optuna database are stored
  model_dir: models/

  # Where test-set .npz files are written for cross-dataset evaluation
  test_data_dir: models/test_data/



# ── Silder dataset ────────────────────────────────────────────────────────────
silder:
  data_root: data/Silder_Data/
  # OpenSim setup XMLs live at the top level of data_root alongside subject dirs
  opensim_setup_dir: data/Silder_Data/
  # Centralized results structure (relative to repo root)
