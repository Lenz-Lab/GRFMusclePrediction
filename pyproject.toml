[project]
name = "grf-muscle-model"
version = "0.1.0"
description = "Predicting lower-limb muscle forces and joint reaction forces from ground reaction forces using sequence models"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "torch",
    "optuna",
    "scikit-learn",
    "pyyaml",
    "opensim>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grf_pipeline_utils*", "models*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403", "F405"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
